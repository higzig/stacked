<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Order status display powered by PopBia Collection." />
  <title>PopBia Collection display</title>
  <link rel="icon" href="popbia-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --board-bg: #f5f2eb;
      --board-accent: #ffd83d;
      --board-ink: #20201f;
      --board-panel: #fffdf9;
      --board-line: #ded9d1;
      --board-ready: #f1dfd0;
      --board-ready-ink: #39271d;
      --board-preparing: #fffdf9;
      --board-preparing-ink: #282725;
      --board-muted: #716b64;
      --board-ready-accent: #925026;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: clamp(56px, 7vh, 76px) minmax(0, 1fr) auto;
      background: var(--board-bg);
      color: var(--board-ink);
      font-family: "DM Sans", sans-serif;
    }

    .board-header {
      position: static;
      inset: auto;
      z-index: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 0;
      padding: 0 clamp(1rem, 2.5vw, 3rem);
      background: transparent;
      color: var(--board-ink);
      backdrop-filter: none;
      border-bottom: 1px solid var(--board-line);
    }

    .board-header-meta {
      display: flex;
      align-items: center;
      gap: .75rem;
      color: var(--board-muted);
      font-size: clamp(.64rem, .75vw, .78rem);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .connection-status::before {
      content: "";
      display: inline-block;
      width: .4rem;
      height: .4rem;
      margin-right: .35rem;
      border-radius: 50%;
      background: #56865c;
    }

    .board-clock {
      color: var(--board-ink);
      font-variant-numeric: tabular-nums;
    }

    .board-header-divider { color: #b4aea6; }

    .board-brand {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font-size: clamp(1rem, 1.35vw, 1.45rem);
      font-weight: 900;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }

    .board-brand-mark {
      width: clamp(2rem, 2.4vw, 2.6rem);
      height: clamp(2rem, 2.4vw, 2.6rem);
      display: grid;
      place-items: center;
      background: var(--board-accent);
      color: var(--board-ink);
      border: 1px solid rgba(48,40,33,.3);
      border-radius: 9px;
      box-shadow: none;
      object-fit: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      font-size: clamp(.9rem, 1.2vw, 1.2rem);
    }

    .board-main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(.75rem, 1.5vw, 1.75rem);
      min-height: 0;
      padding: clamp(.7rem, 1.4vh, 1rem) clamp(1rem, 2.5vw, 3rem);
      overflow: hidden;
    }

    .board-main.single-view {
      grid-template-columns: minmax(0, 1fr);
    }

    .board-column {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(.8rem, 1.2vw, 1.2rem);
      border: 1px solid var(--board-line);
      border-radius: 8px;
      background: var(--board-panel);
      box-shadow: none;
      overflow: hidden;
    }

    .board-column h2 {
      margin: 0 0 .45rem;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(.82rem, 1vw, 1rem);
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .board-column.ready {
      border-color: #dfcabc;
      background: var(--board-ready);
      box-shadow: none;
    }

    .board-column.ready h2 { color: var(--board-ready-accent); }

    .board-column.preparing {
      background: var(--board-panel);
    }

    .board-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-rows: minmax(clamp(68px, 8vh, 88px), auto);
      column-gap: 0;
      row-gap: 0;
      align-content: start;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
    }

    .board-list:has(.empty-state) {
      place-content: center;
    }

    .order-card {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 68px;
      padding: .4rem .3rem;
      border: 0;
      border-bottom: 1px solid var(--board-line);
      border-radius: 0;
      font-family: "DM Sans", sans-serif;
      font-weight: 900;
      letter-spacing: -.035em;
      text-transform: uppercase;
      box-shadow: none;
      overflow: hidden;
    }

    .order-card.ready {
      background: transparent;
      color: var(--board-ready-ink);
      border-bottom: 1px solid rgba(146,80,38,.22);
      box-shadow: none;
    }

    .order-card.ready.overdue {
      background: #f5d7a4;
      color: #3e2b16;
      border-color: #c39a60;
    }

    .overdue-note {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: .15rem;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(.62rem, .75vw, .8rem);
      font-weight: 900;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .order-card.ready.just-ready {
      animation: ready-card-pulse .8s ease-out 1;
      background: #dcebd7;
      color: #18331d;
    }

    .order-card.preparing {
      background: transparent;
      color: var(--board-preparing-ink);
      border-color: var(--board-line);
    }

    .order-number {
      position: relative;
      z-index: 1;
      max-width: 100%;
      font-size: clamp(2.5rem, 3.8vw, 4.3rem);
      line-height: .9;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .order-name {
      position: relative;
      z-index: 1;
      display: block;
      max-width: 92%;
      margin-top: .15rem;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(.9rem, 1.35vw, 1.4rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 1.05;
      text-align: center;
      text-transform: none;
    }

    .order-card.number-name {
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: .8rem;
      padding-inline: .3rem;
    }

    .order-card.number-name .order-number {
      grid-column: 2;
      font-size: clamp(1.45rem, 2vw, 2.15rem);
      letter-spacing: -.04em;
    }

    .order-card.number-name .order-name {
      grid-column: 1;
      grid-row: 1;
      max-width: 100%;
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 2.35rem);
      text-align: left;
      overflow-wrap: anywhere;
    }

    .order-card.number-name .overdue-note {
      grid-column: 1 / -1;
      margin-top: -.1rem;
    }

    .order-card.name .order-number {
      font-size: clamp(1.8rem, 2.7vw, 3rem);
      letter-spacing: -.045em;
      text-align: left;
    }

    .order-card.name,
    .order-card.number { justify-items: start; }

    .order-card.ready:not(.number-name):not(.name) .order-number {
      font-size: clamp(2.8rem, 4.1vw, 4.6rem);
    }

    .order-card.ready.name .order-number,
    .order-card.ready.number-name .order-name {
      font-size: clamp(2rem, 3vw, 3.25rem);
    }

    .board-column.is-hidden { display: none; }

    .ready-announcement {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      background: rgba(32,32,31,.08);
      transition: opacity .28s ease, visibility .28s ease;
      pointer-events: none;
    }

    .ready-announcement.is-visible {
      opacity: 1;
      visibility: visible;
    }

    .ready-announcement-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: clamp(1.2rem, 2vw, 2rem) clamp(1.6rem, 4vw, 3rem);
      border: 2px solid rgba(42,91,49,.38);
      border-radius: 26px;
      background: rgba(255,253,249,.97);
      box-shadow: 0 24px 80px rgba(76,57,39,.2);
      transform: translateY(12px) scale(.97);
      transition: transform .26s ease;
    }

    .ready-announcement.is-visible .ready-announcement-inner {
      transform: translateY(0) scale(1);
    }

    .ready-announcement-label {
      font-size: clamp(.75rem, 1.5vw, 1.1rem);
      letter-spacing: .24em;
      text-transform: uppercase;
      font-weight: 800;
      color: #47724c;
    }

    .ready-announcement-order {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(2.5rem, 8vw, 7rem);
      line-height: .9;
      letter-spacing: -.06em;
      text-transform: uppercase;
      color: var(--board-ink);
    }

    .board-qr {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .55rem;
      width: 100%;
      padding: 0 clamp(1rem, 2.5vw, 3rem);
      border: 0;
      border-top: 1px solid var(--board-line);
      border-radius: 0;
      background: rgba(255,253,249,.72);
      color: var(--board-muted);
    }

    .board-qr canvas {
      width: clamp(28px, 3.6vh, 36px);
      height: clamp(28px, 3.6vh, 36px);
      flex: 0 0 auto;
      padding: 3px;
      border-radius: 5px;
      background: #fffdf8;
    }

    .board-qr-copy {
      min-width: 0;
    }

    .board-qr-copy a {
      display: block;
      color: rgba(48,40,33,.66);
      font-size: .72rem;
      font-weight: 800;
      text-decoration: none;
    }

    .board-qr > .connection-status {
      margin-right: auto;
      color: var(--board-muted);
      font-size: .55rem;
      font-weight: 800;
      letter-spacing: .08em;
      opacity: .45;
      text-transform: uppercase;
    }

    @keyframes ready-card-pulse {
      0% { box-shadow: 0 0 0 0 rgba(216,247,208,.28); }
      50% { box-shadow: 0 0 0 16px rgba(216,247,208,0); }
      100% { box-shadow: 0 0 0 0 rgba(216,247,208,0); }
    }

    .empty-state {
      grid-column: 1 / -1;
      align-self: center;
      justify-self: center;
      min-height: 0;
      width: min(240px, 80%);
      padding: .65rem .8rem;
      border: 0;
      border-radius: 10px;
      color: rgba(48,40,33,.45);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .order-card.ready.just-ready {
        animation: none;
      }

      .ready-announcement,
      .ready-announcement-inner {
        transition: none;
      }
    }

    @media (max-width: 760px) {
      html,
      body {
        height: auto;
        min-height: 100svh;
        overflow-y: auto;
      }

      body {
        grid-template-rows: auto auto auto;
      }

      .board-main {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .board-column {
        min-height: 0;
      }

      .board-list { grid-template-columns: 1fr; }

      .board-list { grid-auto-rows: minmax(68px, auto); }
    }

    @media (max-width: 520px) {
      .board-header {
        min-height: 58px;
      }

      .board-brand {
        justify-content: flex-start;
      }

      .board-header-meta {
        gap: .35rem;
      }

      .board-qr { justify-content: center; }

      .order-card { min-height: 68px; }

      .order-number { font-size: clamp(2.7rem, 14vw, 4.2rem); }

      .order-card.number-name .order-number { font-size: clamp(1.25rem, 6vw, 1.7rem); }

      .order-card.number-name .order-name { font-size: clamp(1.3rem, 8vw, 2rem); }
    }
    /* Distance readability, with the approved warm Ready panel retained. */
    .board-column.ready h2 { font-weight: 900; color: #713815; font-size: clamp(1rem, 1.2vw, 1.25rem); }
    .order-card.number-name .order-number { font-size: clamp(1.6rem, 2.2vw, 2.4rem); }
    .order-card.number-name .order-name { font-size: clamp(1.5rem, 2.4vw, 2.6rem); }
    .order-card.ready.number-name .order-name, .order-card.ready.name .order-number { font-size: clamp(2.2rem, 3.2vw, 3.5rem); }
    .board-brand { text-transform: none; }
    .board-brand-mark { background: transparent; border: 0; border-radius: 50%; flex-shrink: 0; }
    /* Calm attention state and a fully contained footer utility. */
    .order-number { line-height: 1.1; }
    .order-card::before, .order-card::after { display: none; }
    .order-card.ready.overdue { background-image: none; padding-block: .65rem; }
    .overdue-note { width: fit-content; max-width: 100%; padding: .25rem .6rem; margin-top: .35rem; border: 1px solid #aa793a; border-radius: 999px; background: #fff1d8; color: #513610; font-size: clamp(.9rem, 1.1vw, 1.2rem); line-height: 1.2; text-transform: none; letter-spacing: 0; }
    .order-card.number-name .overdue-note { margin-top: .35rem; justify-self: start; }
    .board-qr { padding-block: .6rem; }
    .board-qr-tile { display: flex; align-items: center; gap: .85rem; max-width: 100%; padding: .5rem .7rem; border: 1px solid var(--board-line); border-radius: 12px; background: #fffdf8; }
    .board-qr-copy { max-width: 290px; }
    .board-qr-copy a { color: #514b42; font-size: clamp(.8rem, .9vw, 1rem); line-height: 1.4; }
    .board-qr canvas { display: block; width: 88px; height: 88px; padding: 0; border-radius: 0; }
    /* Reference polish: a single-line attention row and a separate QR tile. */
    .order-card.ready { grid-template-columns: clamp(22px, 2vw, 30px) minmax(0, 1fr) auto; gap: .6rem; padding: .8rem; }
    .order-card.ready.overdue { border-radius: 0; background: transparent; color: var(--board-ready-ink); border-bottom: 1px solid rgba(146,80,38,.22); box-shadow: none; }
    .attention-icon { grid-column: 1; grid-row: 1; width: clamp(22px, 2vw, 30px); height: 30px; }
    .order-card.ready .order-number { grid-column: 2; grid-row: 1; justify-self: start; }
    .order-card.ready.overdue .overdue-note { grid-column: 3; grid-row: 1; margin: 0; padding: .3rem .6rem; border: 0; background: #eac5aa; color: #4a2515; font-weight: 500; white-space: nowrap; justify-self: end; }
    .order-card.ready.number-name { grid-template-columns: clamp(22px, 2vw, 30px) minmax(0, 1fr) clamp(125px, 10vw, 170px) max-content; }
    .order-card.ready.number-name .order-name { grid-column: 2; grid-row: 1; justify-self: start; }
    .order-card.ready.number-name .order-number { grid-column: 4; grid-row: 1; justify-self: end; }
    .order-card.ready.number-name .order-number, .order-card.ready.number .order-number { white-space: nowrap; overflow-wrap: normal; flex-shrink: 0; min-width: 4ch; max-width: none; text-align: right; }
    .board-qr-tile { padding: 0; border: 0; border-radius: 0; background: transparent; gap: 1rem; }
    .board-qr-copy a { color: var(--board-ink); font-size: clamp(.9rem, 1.2vw, 1.2rem); }
    .board-qr-code { padding: .5rem; border: 1px solid var(--board-line); border-radius: 14px; background: #fffdf8; flex-shrink: 0; }
    @media (max-width: 1100px) {
      .order-card.ready.number-name { grid-template-columns: clamp(22px, 2vw, 30px) minmax(0, 1fr) max-content; }
      .order-card.ready.number-name .order-number { grid-column: 3; }
      .order-card.ready.overdue .overdue-note { grid-column: 2 / -1; grid-row: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <header class="board-header">
    <div class="board-brand" aria-label="PopBia">
      <img class="board-brand-mark" src="popbia-favicon.svg" alt="" width="40" height="40">
      <span>PopBia</span>
    </div>
    <div class="board-header-meta">
      <span>Order status</span>
      <span class="board-header-divider" aria-hidden="true">|</span>
      <time id="boardClock" class="board-clock" aria-label="Current local time"></time>
    </div>
  </header>

  <main class="board-main board-grid">
    <div id="readyAnnouncement" class="ready-announcement" aria-live="assertive" aria-atomic="true">
      <div class="ready-announcement-inner">
        <span class="ready-announcement-label">Ready</span>
        <span id="readyAnnouncementOrder" class="ready-announcement-order">Daniel</span>
      </div>
    </div>

    <section class="board-column preparing" aria-label="Preparing orders">
      <h2>Now making</h2>
      <ul class="board-list" id="preparingList" aria-live="polite"></ul>
    </section>

    <section class="board-column ready" aria-label="Ready orders">
      <h2>Ready for pickup</h2>
      <ul class="board-list" id="readyList" aria-live="polite"></ul>
    </section>
  </main>

  <footer class="board-qr" aria-labelledby="boardQrTitle">
    <div class="board-qr-tile">
    <div class="board-qr-copy">
          <a id="boardQrUrl" href="" rel="noopener"><span id="boardQrTitle">Scan for your phone</span></a>
    </div>
    <div class="board-qr-code"><canvas id="boardQrCode" width="88" height="88" role="img" aria-label="QR code to open the collection board on your phone"></canvas></div>
    </div>
  </footer>

  <script src="client-config.js?v=board-url"></script>
  <script src="qrcode.js"></script>
  <script>
    const STORAGE_KEY = "stacked-demo-orders-v1";
    const QUEUE_STYLE_KEY = "stacked-demo-queue-style-v1";
    const OVERDUE_MINUTES_KEY = "stacked-demo-overdue-minutes-v1";
    const READY_CHIME_KEY = "stacked-demo-ready-chime-v1";
    const CHANNEL_NAME = "stacked-demo-orders";
    const DEFAULT_NUMBER_ORDERS = [
      { id: "order-42", label: "42", type: "number", status: "ready" },
      { id: "order-43", label: "43", type: "number", status: "ready" },
      { id: "order-44", label: "44", type: "number", status: "preparing" },
      { id: "order-45", label: "45", type: "number", status: "preparing" }
    ];
    const DEFAULT_NAME_ORDERS = [
      { id: "name-aoife", label: "Aoife", type: "name", status: "ready" },
      { id: "name-jack", label: "Jack", type: "name", status: "ready" },
      { id: "name-sarah", label: "Sarah", type: "name", status: "preparing" },
      { id: "name-daniel", label: "Daniel", type: "name", status: "preparing" }
    ];
    const DEFAULT_NUMBER_NAME_ORDERS = [
      { id: "number-name-42", label: "Aoife", number: "42", type: "number-name", status: "ready" },
      { id: "number-name-43", label: "Jack", number: "43", type: "number-name", status: "ready" },
      { id: "number-name-44", label: "Sarah", number: "44", type: "number-name", status: "preparing" },
      { id: "number-name-45", label: "Daniel", number: "45", type: "number-name", status: "preparing" }
    ];

    const boardClock = document.getElementById("boardClock");
    const preparingList = document.getElementById("preparingList");
    const readyList = document.getElementById("readyList");
    const readyAnnouncementEl = document.getElementById("readyAnnouncement");
    const readyAnnouncementOrderEl = document.getElementById("readyAnnouncementOrder");
    const readyAnnouncementLabelEl = document.querySelector(".ready-announcement-label");
    const preparingColumn = document.querySelector(".board-column.preparing");
    const readyColumn = document.querySelector(".board-column.ready");
    const boardGrid = document.querySelector(".board-grid");
    const channel = "BroadcastChannel" in window ? new BroadcastChannel(CHANNEL_NAME) : null;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const readyAnnouncementQueue = [];
    let readyAnnouncementActive = false;
    let previousOrdersById = new Map();
    let readyTransitionTrackingReady = false;
    const justReadyOrderIds = new Set();

    function getCollectionConfig() {
      return (window.CLIENT_CONFIG && window.CLIENT_CONFIG.collection) || {};
    }

    function getQueueStyle() {
      const stored = localStorage.getItem(QUEUE_STYLE_KEY);
      return ["number", "name", "number-name"].includes(stored) ? stored : (getCollectionConfig().identificationMode || "number");
    }

    function getDefaultOrders() {
      const queueStyle = getQueueStyle();
      const defaults = queueStyle === "name" ? DEFAULT_NAME_ORDERS : queueStyle === "number-name" ? DEFAULT_NUMBER_NAME_ORDERS : DEFAULT_NUMBER_ORDERS;
      return defaults.map(order => ({ ...order }));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function normalizeLegacyNumber(value) {
      const parsed = Number(value);
      return Number.isInteger(parsed) && parsed > 0 ? String(parsed) : null;
    }

    function sanitizeOrder(order) {
      if (!order || typeof order !== "object") return null;

      const status = ["preparing", "ready", "collected"].includes(order.status) ? order.status : "preparing";
      const type = ["name", "number-name", "number"].includes(order.type) ? order.type : "number";
      const readyAt = Number(order.readyAt);
      const collectedAt = Number(order.collectedAt);
      if (type === "number-name") {
        const label = String(order.label ?? order.name ?? order.customerName ?? "").trim();
        const number = normalizeLegacyNumber(order.number);
        if (!number) return null;
        return { id: String(order.id || number), label, type, status, readyAt: Number.isFinite(readyAt) ? readyAt : null, collectedAt: Number.isFinite(collectedAt) ? collectedAt : null, number };
      }

      if (type === "name") {
        const label = String(order.label ?? order.name ?? order.customerName ?? "").trim();
        if (!label) return null;
        return { id: String(order.id || label), label, type, status, readyAt: Number.isFinite(readyAt) ? readyAt : null, collectedAt: Number.isFinite(collectedAt) ? collectedAt : null, number: null };
      }

      const label = normalizeLegacyNumber(order.label ?? order.number ?? order.value);
      if (!label) return null;
      return { id: String(order.id || label), label, type: "number", status, readyAt: Number.isFinite(readyAt) ? readyAt : null, collectedAt: Number.isFinite(collectedAt) ? collectedAt : null, number: null };
    }

    function loadOrders() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (Array.isArray(stored)) {
          const valid = stored.map(sanitizeOrder).filter(Boolean);
          return valid;
        }
      } catch (error) {
        console.warn("Unable to load demo orders from storage.", error);
      }
      return getDefaultOrders();
    }

    function persistOrders(orders) {
      const safeOrders = orders
        .map(sanitizeOrder)
        .filter(Boolean)
        .sort((a, b) => {
          if (a.type === "number" && b.type === "number") return Number(a.label) - Number(b.label);
          if (a.type === "number-name" && b.type === "number-name") return Number(a.number) - Number(b.number);
          if (a.type === "number") return -1;
          if (a.type === "number-name") return b.type === "number" ? 1 : -1;
          if (b.type === "number") return 1;
          if (b.type === "number-name") return 1;
          return a.label.localeCompare(b.label, undefined, { sensitivity: "base" });
        });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(safeOrders));
      if (channel) {
        channel.postMessage({ type: "orders-update", orders: safeOrders });
      }
      return safeOrders;
    }

    function applyConfig() {
      const collectionConfig = getCollectionConfig();
      const businessName = "PopBia";
      document.title = `${businessName} | Collection board`;
      document.documentElement.style.setProperty("--board-accent", collectionConfig.accentColor || "#ffd83d");

      const requestedView = new URLSearchParams(window.location.search).get("view");
      const view = ["full", "preparing", "ready"].includes(requestedView) ? requestedView : "full";
      preparingColumn.classList.toggle("is-hidden", view === "ready");
      readyColumn.classList.toggle("is-hidden", view === "preparing");
      boardGrid.classList.toggle("single-view", view !== "full");

      const boardUrl = (window.CLIENT_CONFIG && window.CLIENT_CONFIG.publicBoardUrl) || window.location.href;
      const boardQrUrl = document.getElementById("boardQrUrl");
      const boardQrCode = document.getElementById("boardQrCode");
      if (boardQrUrl) {
        boardQrUrl.href = boardUrl;
        boardQrUrl.setAttribute("aria-label", `Open ${businessName} collection board`);
      }
      if (boardQrCode && window.QRCode) {
        window.QRCode.toCanvas(boardQrCode, boardUrl, {
          width: 88,
          margin: 1,
          color: { dark: "#111111", light: "#ffffff" }
        });
      }
    }

    function showReadyAnnouncement(orderLabel) {
      if (!readyAnnouncementEl || !readyAnnouncementOrderEl) return;

      readyAnnouncementOrderEl.textContent = orderLabel;
      readyAnnouncementEl.classList.add("is-visible");
      const duration = reducedMotion ? 1200 : 1700;
      window.clearTimeout(showReadyAnnouncement._hideTimer);
      showReadyAnnouncement._hideTimer = window.setTimeout(() => {
        readyAnnouncementEl.classList.remove("is-visible");
      }, duration);
    }

    function updateClock() {
      if (!boardClock) return;
      const now = new Date();
      boardClock.dateTime = now.toISOString();
      boardClock.textContent = new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(now);
    }

    function queueReadyAnnouncement(order) {
      const orderLabel = order.type === "number"
        ? `#${order.label}`
        : order.type === "number-name"
          ? `#${order.number || "?"}${order.label ? ` · ${order.label}` : ""}`
          : order.label;
      const alreadyQueued = readyAnnouncementQueue.some(item => item.id === order.id && item.label === orderLabel);
      if (alreadyQueued) return;

      readyAnnouncementQueue.push({ id: String(order.id), label: orderLabel });
      if (!readyAnnouncementActive) {
        processReadyAnnouncementQueue();
      }
    }

    function processReadyAnnouncementQueue() {
      if (!readyAnnouncementQueue.length) {
        readyAnnouncementActive = false;
        return;
      }

      readyAnnouncementActive = true;
      const nextOrder = readyAnnouncementQueue.shift();
      showReadyAnnouncement(nextOrder.label);
      playReadyChime();
      const nextDelay = reducedMotion ? 1200 : 1600;
      window.setTimeout(() => {
        processReadyAnnouncementQueue();
      }, nextDelay);
    }

    function playReadyChime() {
      const stored = localStorage.getItem(READY_CHIME_KEY);
      const enabled = stored === null ? getCollectionConfig().readyChime !== false : stored === "true";
      if (!enabled || !window.AudioContext) return;
      try {
        const context = new AudioContext();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.frequency.value = 740;
        gain.gain.setValueAtTime(.0001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(.08, context.currentTime + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + .18);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + .2);
        oscillator.addEventListener("ended", () => context.close());
      } catch (error) {
        // Browser autoplay restrictions can prevent a demo chime.
      }
    }

    function queueJustReadyOrder(orderId) {
      if (!orderId) return;
      justReadyOrderIds.add(orderId);
      window.setTimeout(() => {
        justReadyOrderIds.delete(orderId);
        renderBoard();
      }, reducedMotion ? 700 : 900);
    }

    function detectReadyTransitions(currentOrders) {
      if (!readyTransitionTrackingReady) {
        previousOrdersById = new Map(currentOrders.map(order => [String(order.id), { status: order.status, label: order.label, type: order.type, number: order.number }]));
        readyTransitionTrackingReady = true;
        return;
      }

      const nextMap = new Map(currentOrders.map(order => [String(order.id), { status: order.status, label: order.label, type: order.type, number: order.number }]));
      const readyTransitions = [];

      for (const [orderId, nextOrder] of nextMap.entries()) {
        const previousOrder = previousOrdersById.get(orderId);
        if (previousOrder && previousOrder.status === "preparing" && nextOrder.status === "ready") {
          readyTransitions.push({ id: orderId, label: nextOrder.label, type: nextOrder.type, number: nextOrder.number });
          queueJustReadyOrder(orderId);
        }
      }

      previousOrdersById = nextMap;
      readyTransitions.forEach(order => queueReadyAnnouncement(order));
    }

    function renderOrderList(listElement, status) {
      const queueStyle = getQueueStyle();
      const overdueMinutes = Number(localStorage.getItem(OVERDUE_MINUTES_KEY)) || Number(getCollectionConfig().overdueMinutes) || 10;
      const orders = loadOrders()
        .filter(order => order.status === status && order.status !== "collected" && (queueStyle === "number-name" ? order.type === "number-name" : queueStyle === "name" ? order.type === "name" : order.type === "number"))
        .map((order, storedIndex) => ({ order, storedIndex }));

      if (status === "ready") {
        orders.sort((a, b) => (Number(b.order.readyAt) || 0) - (Number(a.order.readyAt) || 0) || a.storedIndex - b.storedIndex);
      } else {
        orders.sort((a, b) => {
          const numberA = Number(a.order.type === "number-name" ? a.order.number : a.order.type === "number" ? a.order.label : 0);
          const numberB = Number(b.order.type === "number-name" ? b.order.number : b.order.type === "number" ? b.order.label : 0);
          if (numberA && numberB) return numberA - numberB;
          const createdA = Number(String(a.order.id).match(/-(\d{13})-/)?.[1]) || 0;
          const createdB = Number(String(b.order.id).match(/-(\d{13})-/)?.[1]) || 0;
          if (createdA && createdB) return createdA - createdB;
          return a.storedIndex - b.storedIndex;
        });
      }

      if (!orders.length) {
        listElement.innerHTML = '<li class="empty-state">No orders</li>';
        return;
      }

      listElement.innerHTML = orders.map(({ order }) => {
        const classes = ["order-card", status];
        const overdue = status === "ready" && Number.isFinite(Number(order.readyAt)) && Date.now() - Number(order.readyAt) >= overdueMinutes * 60000;
        if (overdue) classes.push("overdue");
        if (status === "ready" && justReadyOrderIds.has(String(order.id))) {
          classes.push("just-ready");
        }
        const identifier = escapeHtml(order.type === "number" ? `#${order.label}` : order.type === "number-name" ? `#${order.number || "?"}` : order.label);
        const customerName = order.type === "number-name" && order.label
          ? `<span class="order-name">${escapeHtml(order.label)}</span>${overdue ? '<span class="overdue-note">Please see staff</span>' : ""}`
          : overdue ? '<span class="overdue-note">Please see staff</span>' : "";
        return `
          <li class="${classes.join(" ")} ${order.type}">
            ${overdue ? '<svg class="attention-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M9 20a3 3 0 0 0 6 0M12 2V1"/></svg>' : ""}
            <span class="order-number">${identifier}</span>
            ${customerName}
          </li>
        `;
      }).join("");
    }

    function renderBoard() {
      const currentOrders = loadOrders();
      detectReadyTransitions(currentOrders);
      renderOrderList(preparingList, "preparing");
      renderOrderList(readyList, "ready");
    }

    applyConfig();
    updateClock();
    renderBoard();
    window.setInterval(updateClock, 1000);
    window.setInterval(renderBoard, 1000);

    if (channel) {
      channel.addEventListener("message", (event) => {
        if (!event.data) return;
        if (event.data.type === "queue-style-update") {
          localStorage.setItem(QUEUE_STYLE_KEY, event.data.queueStyle || getQueueStyle());
        }
        if (event.data.type === "orders-update") {
          const nextOrders = Array.isArray(event.data.orders) ? event.data.orders : loadOrders();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextOrders));
        }
        renderBoard();
      });
    }

    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY || event.key === QUEUE_STYLE_KEY) {
        renderBoard();
      }
    });

    window.addEventListener("beforeunload", () => {
      readyAnnouncementQueue.length = 0;
    });
  </script>
</body>
</html>
