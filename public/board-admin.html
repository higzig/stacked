<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Staff collection controls for the Stacked food truck." />
  <title>Collection controls | Stacked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: var(--paper);
      overflow-x: hidden;
    }

    .demo-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 4rem 1rem;
      background:
        linear-gradient(135deg, rgba(17,17,17,.96), rgba(17,17,17,.78)),
        url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1800&q=88") center/cover;
      color: white;
    }

    .demo-panel {
      width: min(780px, calc(100vw - 24px));
      max-width: 100%;
      box-sizing: border-box;
      padding: clamp(1.5rem, 4vw, 3rem);
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: rgba(17,17,17,.62);
      box-shadow: 0 30px 80px rgba(0,0,0,.28);
      backdrop-filter: blur(8px);
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      padding: .45rem .75rem;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--ink);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .demo-panel h1 {
      margin: 1.1rem 0 1rem;
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.04em;
      text-transform: uppercase;
      font-size: clamp(2.7rem, 7vw, 5rem);
      line-height: .96;
    }

    .demo-panel p {
      max-width: 620px;
      color: rgba(255,255,255,.78);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .demo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .9rem;
      margin-top: 2rem;
    }

    .demo-actions .btn {
      min-width: 220px;
    }

    .demo-features {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1.5rem;
      padding-left: 1rem;
      color: rgba(255,255,255,.82);
      font-weight: 700;
    }

    .demo-features li {
      list-style: disc;
      margin-left: .2rem;
    }

    .demo-note {
      margin-top: 2.1rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.68);
      font-size: .95rem;
    }

    .demo-cta {
      margin-top: 2.2rem;
      padding: 1.4rem 1.2rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }

    .demo-cta h2 {
      margin: 0 0 .7rem;
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.04em;
      text-transform: uppercase;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
    }

    .demo-cta p {
      margin: 0 0 1rem;
      font-size: 1rem;
    }

    .demo-cta .btn {
      display: inline-flex;
      min-width: 220px;
    }

    .collection-demo {
      margin-top: 2rem;
      padding: 1.5rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 22px;
      background: rgba(17,17,17,.48);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }

    .collection-demo h2 {
      margin: 0 0 .45rem;
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.04em;
      text-transform: uppercase;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
    }

    .collection-demo p {
      margin: 0;
      color: rgba(255,255,255,.76);
      font-size: 1rem;
      line-height: 1.5;
    }

    .collection-controls {
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr));
      gap: .9rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      min-width: 0;
    }

    .field label {
      color: rgba(255,255,255,.82);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      min-height: 52px;
      padding: .8rem 1rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      color: white;
      font-weight: 700;
    }

    .field input::placeholder {
      color: rgba(255,255,255,.44);
    }

    .control-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      margin-top: 1rem;
    }

    .control-actions .btn {
      min-width: 150px;
    }

    .orders-list {
      margin-top: 1.2rem;
      display: grid;
      gap: .75rem;
    }

    .order-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 1rem;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      color: white;
      font-weight: 700;
    }

    .order-pill strong {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      letter-spacing: -.05em;
      font-family: "Archivo Black", sans-serif;
      text-transform: uppercase;
    }

    .order-pill span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      padding: .35rem .6rem;
      border-radius: 999px;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .order-pill.ready span {
      background: rgba(216,247,208,.15);
      color: #d8f7d0;
    }

    .order-pill.preparing span {
      background: rgba(247,229,169,.15);
      color: #f7e5a9;
    }

    .collection-note {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.72);
      font-size: .9rem;
      line-height: 1.5;
    }

    .setup-panel {
      margin-top: 1.25rem;
      padding: 1rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 18px;
      background: rgba(255,255,255,.04);
    }

    .setup-panel h3 {
      margin: 0 0 .9rem;
      font-size: 1.15rem;
      letter-spacing: -.03em;
      text-transform: none;
    }

    .setup-options {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    .setup-option {
      flex: 1 1 190px;
      min-height: 46px;
      padding: .75rem .9rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: all .18s ease;
    }

    .setup-option:hover,
    .setup-option:focus-visible {
      border-color: rgba(255,255,255,.4);
    }

    .setup-option.is-selected {
      background: var(--yellow);
      border-color: var(--ink);
      color: var(--ink);
      box-shadow: 4px 4px 0 rgba(17,17,17,.4);
    }

    .queue-settings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-top: 1rem;
      padding: .75rem 1rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
    }

    .admin-demo-note {
      display: none;
    }

    .queue-settings-body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem;
      width: 100%;
      padding-top: .75rem;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .queue-settings-body.hidden { display: none; }

    .queue-settings-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: .75rem;
      margin-left: auto;
    }

    .queue-settings.hidden,
    .admin-view.hidden,
    .setup-panel.hidden {
      display: none;
    }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem;
      color: rgba(255,255,255,.78);
      font-size: .9rem;
    }

    .settings-row[hidden] { display: none; }

    .settings-row label {
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .settings-row select {
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: white;
      padding: .45rem .7rem;
    }

    .queue-settings-btn {
      min-height: 42px;
      padding: .5rem .9rem;
      font-size: .78rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.04);
      color: white;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .queue-settings-btn.silver {
      background: rgba(196, 201, 208, 0.18);
      border-color: rgba(255,255,255,.22);
      color: rgba(255,255,255,.96);
    }

    .queue-settings-btn.silver:hover,
    .queue-settings-btn.silver:focus-visible {
      background: rgba(196, 201, 208, 0.26);
    }

    .admin-top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1rem;
      align-items: stretch;
    }

    .admin-connection-status {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin-left: auto;
      color: rgba(255,255,255,.58);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .admin-connection-status::before {
      content: "";
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: #78df75;
    }

    .admin-top-actions .btn {
      min-height: 52px;
      flex: 0 0 auto;
    }

    .admin-control-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .9rem;
      margin-top: 1rem;
      align-items: end;
    }

    .admin-action-field {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      justify-content: flex-end;
    }

    .admin-action-field .btn {
      width: 100%;
      min-height: 52px;
      justify-self: center;
      align-self: center;
      text-align: center;
    }

    .order-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 1rem;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
    }

    .order-summary {
      display: flex;
      align-items: center;
      gap: .75rem;
      min-width: 0;
      flex: 1;
    }

    .order-label {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.05em;
      text-transform: uppercase;
      color: white;
    }

    .order-status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      padding: .35rem .6rem;
      border-radius: 999px;
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .order-row.ready .order-status-badge {
      background: rgba(216,247,208,.15);
      color: #d8f7d0;
    }

    .order-row.preparing .order-status-badge {
      background: rgba(247,229,169,.15);
      color: #f7e5a9;
    }

    .order-row.ready.overdue .order-status-badge {
      background: rgba(239,69,56,.22);
      color: #ffb2aa;
    }

    .order-row.ready.overdue { border-color: rgba(239,69,56,.45); }

    .order-row.collected { opacity: .58; }

    .order-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: .5rem;
      flex-shrink: 0;
    }

    .order-action-btn {
      min-height: 42px;
      padding: .62rem .8rem;
      border-radius: 10px;
      border: 2px solid transparent;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      min-width: 104px;
    }

    .order-action-btn.preparing {
      background: rgba(247,229,169,.22);
      border-color: rgba(247,229,169,.5);
      color: #f7e5a9;
    }

    .order-action-btn.ready {
      background: rgba(216,247,208,.22);
      border-color: rgba(216,247,208,.5);
      color: #d8f7d0;
    }

    .order-action-btn.remove {
      background: rgba(239,69,56,.14);
      border-color: rgba(239,69,56,.45);
      color: #ffb2aa;
    }

    .order-action-btn.edit {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.22);
      color: rgba(255,255,255,.86);
    }

    .order-action-btn.collected {
      background: rgba(120,223,117,.22);
      border-color: rgba(120,223,117,.5);
      color: #bff7b7;
    }

    .order-timer.overdue { color: #ffb2aa; font-weight: 800; }

    @media (max-width: 820px) {
      .collection-controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .demo-shell {
        padding: 1rem .75rem;
      }

      .demo-panel {
        padding: 1.25rem;
        border-radius: 20px;
      }

      .order-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: .75rem;
        padding: .9rem;
      }

      .order-summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: .6rem;
      }

      .order-summary > div {
        min-width: 0;
      }

      .order-label {
        display: block;
        overflow-wrap: anywhere;
      }

      .order-status-badge {
        min-width: 0;
        white-space: nowrap;
      }

      .order-timer {
        display: block;
        margin-top: .35rem;
      }

      .order-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        width: 100%;
      }

      .order-action-btn {
        min-width: 0;
        width: 100%;
        min-height: 48px;
        padding-inline: .55rem;
      }

      .demo-actions,
      .demo-actions .btn,
      .demo-cta .btn,
      .control-actions .btn {
        width: 100%;
      }

      .control-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <div class="demo-panel">
      <h1>Collection controls</h1>

      <p>
        Add an order, mark it ready, then mark it collected when the customer has it.
      </p>

      <div class="demo-actions">
        <a class="btn btn-dark" href="board.html" target="_blank" rel="noopener noreferrer">Open board</a>
      </div>

      <section class="collection-demo" id="collection-demo" aria-labelledby="collection-demo-title">
        <h2 id="collection-demo-title">Queue management</h2>
        <p class="admin-demo-note">The queue stays beside your existing register. Changes sync with the local demo collection screen.</p>

        <div id="setupPanel" class="setup-panel" aria-live="polite">
          <h3>How do you identify orders?</h3>
          <div class="setup-options">
            <button class="setup-option" type="button" data-setup-mode="number">Order numbers</button>
            <button class="setup-option" type="button" data-setup-mode="name">Customer names</button>
            <button class="setup-option" type="button" data-setup-mode="number-name">Order number + name</button>
          </div>
        </div>

        <div id="adminQueueView" class="admin-view hidden">
          <div id="queueSettingsPanel" class="queue-settings" aria-live="polite">
            <button class="queue-settings-btn" id="queueSettingsToggle" type="button" aria-expanded="false" aria-controls="queueSettingsBody">Queue settings</button>
            <!-- Local demo transport only; this is not a cloud or cross-device connection. -->
            <span class="admin-connection-status">Local demo connected</span>
            <div id="queueSettingsBody" class="queue-settings-body hidden">
            <div class="settings-row">
              <label for="queueStyleSelect">Queue style</label>
              <select id="queueStyleSelect">
                <option value="number">Order numbers</option>
                <option value="name">Customer names</option>
                <option value="number-name">Order number + name</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="overdueSelect">Ready reminder</label>
              <select id="overdueSelect">
                <option value="10">10 seconds</option>
                <option value="30">30 seconds</option>
                <option value="600" selected>10 minutes</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="readyChimeSelect">Ready chime</label>
              <select id="readyChimeSelect">
                <option value="on">On</option>
                <option value="off">Off</option>
              </select>
            </div>
            <div class="queue-settings-actions">
              <button class="queue-settings-btn" id="resetDemoBtn" type="button">Reset orders</button>
            </div>
            </div>
          </div>

          <div class="admin-control-row">
            <div class="field" id="customerNameField">
              <label for="customerNameInput">Customer name</label>
              <input id="customerNameInput" type="text" placeholder="e.g. Sarah" />
            </div>

            <div class="field admin-action-field">
              <label>Queue action</label>
              <button class="btn btn-yellow" id="addOrderBtn" type="button">Add order</button>
            </div>
          </div>
        </div>

        <div class="orders-list" id="ordersList" aria-live="polite"></div>

      </section>
    </div>
  </main>

  <script src="client-config.js"></script>
  <script>
    const STORAGE_KEY = "stacked-demo-orders-v1";
    const QUEUE_STYLE_KEY = "stacked-demo-queue-style-v1";
    const OVERDUE_MINUTES_KEY = "stacked-demo-overdue-minutes-v1";
    const READY_CHIME_KEY = "stacked-demo-ready-chime-v1";
    const NEXT_NUMBER_KEY = "stacked-demo-next-number-v1";
    const SETUP_COMPLETE_KEY = "stacked-demo-setup-complete-v1";
    const CHANNEL_NAME = "stacked-demo-orders";
    const DEFAULT_OVERDUE_MINUTES = Number(window.CLIENT_CONFIG?.collection?.overdueMinutes) || 10;
    const DEFAULT_NUMBER_ORDERS = [
      { id: "order-42", label: "42", type: "number", status: "ready", readyAt: Date.now() },
      { id: "order-43", label: "43", type: "number", status: "ready", readyAt: Date.now() - 120000 },
      { id: "order-44", label: "44", type: "number", status: "preparing" },
      { id: "order-45", label: "45", type: "number", status: "preparing" }
    ];
    const DEFAULT_NAME_ORDERS = [
      { id: "name-aoife", label: "Aoife", type: "name", status: "ready", readyAt: Date.now() },
      { id: "name-jack", label: "Jack", type: "name", status: "ready", readyAt: Date.now() - 120000 },
      { id: "name-sarah", label: "Sarah", type: "name", status: "preparing" },
      { id: "name-daniel", label: "Daniel", type: "name", status: "preparing" }
    ];
    const DEFAULT_NUMBER_NAME_ORDERS = [
      { id: "number-name-42", label: "Aoife", number: "42", type: "number-name", status: "ready", readyAt: Date.now() },
      { id: "number-name-43", label: "Jack", number: "43", type: "number-name", status: "ready", readyAt: Date.now() - 120000 },
      { id: "number-name-44", label: "Sarah", number: "44", type: "number-name", status: "preparing" },
      { id: "number-name-45", label: "Daniel", number: "45", type: "number-name", status: "preparing" }
    ];

    const setupPanel = document.getElementById("setupPanel");
    const adminQueueView = document.getElementById("adminQueueView");
    const queueSettingsPanel = document.getElementById("queueSettingsPanel");
    const queueSettingsToggle = document.getElementById("queueSettingsToggle");
    const queueSettingsBody = document.getElementById("queueSettingsBody");
    const queueStyleSelect = document.getElementById("queueStyleSelect");
    const overdueSelect = document.getElementById("overdueSelect");
    const readyChimeSelect = document.getElementById("readyChimeSelect");
    const customerNameField = document.getElementById("customerNameField");
    const customerNameLabel = customerNameField.querySelector("label");
    const customerNameInput = document.getElementById("customerNameInput");
    const addOrderBtn = document.getElementById("addOrderBtn");
    const resetDemoBtn = document.getElementById("resetDemoBtn");
    const ordersList = document.getElementById("ordersList");
    const setupButtons = Array.from(document.querySelectorAll(".setup-option"));
    const channel = "BroadcastChannel" in window ? new BroadcastChannel(CHANNEL_NAME) : null;
    let editingOrderId = null;

    function safeText(value) {
      return String(value ?? "").trim();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function makeOrderId(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
    }

    function getQueueStyle() {
      const stored = localStorage.getItem(QUEUE_STYLE_KEY);
      return ["number", "name", "number-name"].includes(stored) ? stored : (window.CLIENT_CONFIG?.collection?.identificationMode || "number");
    }

    function persistQueueStyle(style) {
      const queueStyle = ["number", "name", "number-name"].includes(style) ? style : "number";
      localStorage.setItem(QUEUE_STYLE_KEY, queueStyle);
      if (channel) {
        channel.postMessage({ type: "queue-style-update", queueStyle });
      }
      return queueStyle;
    }

    function getOverdueMinutes() {
      const stored = Number(localStorage.getItem(OVERDUE_MINUTES_KEY));
      if (Number.isFinite(stored) && stored > 0) return stored;
      localStorage.setItem(OVERDUE_MINUTES_KEY, String(DEFAULT_OVERDUE_MINUTES));
      return DEFAULT_OVERDUE_MINUTES;
    }

    function setOverdueMinutes(value) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed) || parsed <= 0) return;
      localStorage.setItem(OVERDUE_MINUTES_KEY, String(parsed));
      if (channel) {
        channel.postMessage({ type: "queue-settings-update", overdueMinutes: parsed });
      }
      renderOrders();
    }

    function isReadyChimeEnabled() {
      const stored = localStorage.getItem(READY_CHIME_KEY);
      return stored === null ? window.CLIENT_CONFIG?.collection?.readyChime !== false : stored === "true";
    }

    function setReadyChimeEnabled(value) {
      const enabled = value === "on";
      localStorage.setItem(READY_CHIME_KEY, String(enabled));
      if (channel) channel.postMessage({ type: "queue-settings-update", readyChime: enabled });
    }

    function isSetupComplete() {
      return localStorage.getItem(SETUP_COMPLETE_KEY) === "true";
    }

    function completeSetup(style) {
      const queueStyle = ["number", "name", "number-name"].includes(style) ? style : "number";
      localStorage.setItem(SETUP_COMPLETE_KEY, "true");
      persistQueueStyle(queueStyle);
      const orders = getDefaultOrdersForStyle(queueStyle);
      writeOrders(orders, { silent: true, skipRender: true });
      refreshQueueUi();
      renderOrders();
    }

    function getDefaultOrdersForStyle(style = getQueueStyle()) {
      const defaults = style === "name" ? DEFAULT_NAME_ORDERS : style === "number-name" ? DEFAULT_NUMBER_NAME_ORDERS : DEFAULT_NUMBER_ORDERS;
      return defaults.map(order => ({ ...order }));
    }

    function normalizeLegacyNumber(value) {
      const parsed = Number(value);
      return Number.isInteger(parsed) && parsed > 0 ? String(parsed) : null;
    }

    function sanitizeOrder(order) {
      if (!order || typeof order !== "object") return null;

      const status = ["preparing", "ready", "collected"].includes(order.status) ? order.status : "preparing";
      const type = ["name", "number-name", "number"].includes(order.type) ? order.type : "number";
      const readyAt = Number(order.readyAt);
      const normalizedReadyAt = Number.isFinite(readyAt) ? readyAt : null;
      const collectedAt = Number(order.collectedAt);
      const normalizedCollectedAt = Number.isFinite(collectedAt) ? collectedAt : null;

      if (type === "name" || type === "number-name") {
        const label = safeText(order.label ?? order.name ?? order.customerName);
        if (!label) return null;
        return {
          id: safeText(order.id) || makeOrderId("name"),
          label,
          type,
          status,
          readyAt: normalizedReadyAt,
          collectedAt: normalizedCollectedAt,
          number: normalizeLegacyNumber(order.number)
        };
      }

      const label = normalizeLegacyNumber(order.label ?? order.number ?? order.value ?? order.id);
      if (!label) return null;
      return {
        id: safeText(order.id) || makeOrderId("number"),
        label,
        type: "number",
        status,
        readyAt: normalizedReadyAt,
        collectedAt: normalizedCollectedAt,
        number: null
      };
    }

    function loadOrders() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (Array.isArray(stored)) {
          const normalized = stored.map(sanitizeOrder).filter(Boolean);
          return normalized;
        }
      } catch (error) {
        console.warn("Unable to read demo orders.", error);
      }
      return getDefaultOrdersForStyle(getQueueStyle());
    }

    function sortOrders(a, b) {
      if (a.type === "number" && b.type === "number") {
        return Number(a.label) - Number(b.label);
      }
      if (a.type === "number-name" && b.type === "number-name") {
        return Number(a.number) - Number(b.number);
      }
      if (a.type === "number") return -1;
      if (a.type === "number-name") return b.type === "number" ? 1 : -1;
      if (b.type === "number") return 1;
      if (b.type === "number-name") return 1;
      return a.label.localeCompare(b.label, undefined, { sensitivity: "base" });
    }

    function getNextNumber() {
      const stored = Number(localStorage.getItem(NEXT_NUMBER_KEY));
      if (Number.isInteger(stored) && stored > 0) {
        return stored;
      }

      const highest = loadOrders()
        .filter(order => order.type === "number" || order.type === "number-name")
        .reduce((max, order) => Math.max(max, Number(order.type === "number-name" ? order.number : order.label) || 0), 0);

      const next = highest > 0 ? highest + 1 : 46;
      localStorage.setItem(NEXT_NUMBER_KEY, String(next));
      return next;
    }

    function setNextNumber(nextNumber) {
      const parsed = Number(nextNumber);
      if (!Number.isInteger(parsed) || parsed < 1) return;
      localStorage.setItem(NEXT_NUMBER_KEY, String(parsed));
    }

    function getReadyRemainingSeconds(order) {
      if (order.status !== "ready" || !Number.isFinite(Number(order.readyAt))) return null;
      const timeoutSeconds = getOverdueMinutes() * 60;
      const elapsedSeconds = (Date.now() - Number(order.readyAt)) / 1000;
      return Math.max(0, timeoutSeconds - elapsedSeconds);
    }

    function formatCountdown(totalSeconds) {
      const rounded = Math.ceil(totalSeconds);
      const minutes = Math.floor(rounded / 60);
      const seconds = rounded % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function isOverdue(order) {
      return order.status === "ready" && getReadyRemainingSeconds(order) === 0;
    }

    function writeOrders(nextOrders, options = {}) {
      const { silent = false, skipRender = false } = options;
      const safeOrders = nextOrders
        .map(sanitizeOrder)
        .filter(Boolean)
        .sort(sortOrders);

      localStorage.setItem(STORAGE_KEY, JSON.stringify(safeOrders));
      if (channel && !silent) {
        channel.postMessage({ type: "orders-update", queueStyle: getQueueStyle(), orders: safeOrders });
      }
      if (!skipRender) {
        renderOrders();
      }
      return safeOrders;
    }

    function refreshQueueUi() {
      const queueStyle = getQueueStyle();
      const setupComplete = isSetupComplete();
      setupPanel.classList.toggle("hidden", setupComplete);
      adminQueueView.classList.toggle("hidden", !setupComplete);

      const isNameMode = queueStyle === "name" || queueStyle === "number-name";
      if (customerNameInput) {
        customerNameField.style.display = isNameMode || Boolean(editingOrderId) ? "flex" : "none";
        customerNameLabel.textContent = editingOrderId && queueStyle === "number" ? "Order number" : "Customer name";
        customerNameInput.placeholder = editingOrderId && queueStyle === "number" ? "e.g. 42" : "e.g. Sarah";
      }
      addOrderBtn.textContent = editingOrderId ? "Save edit" : (queueStyle === "number" ? "Add Order Number" : "Add order");
      if (queueStyleSelect) {
        queueStyleSelect.value = queueStyle;
      }
      if (overdueSelect) {
        overdueSelect.value = String(getOverdueMinutes() * 60);
      }
      if (readyChimeSelect) {
        readyChimeSelect.value = isReadyChimeEnabled() ? "on" : "off";
      }
      if (queueSettingsPanel) {
        queueSettingsPanel.classList.remove("hidden");
      }
    }

    function renderOrders() {
      const queueStyle = getQueueStyle();
      const orders = loadOrders().filter(order => order.status !== "collected" && (queueStyle === "number-name" ? order.type === "number-name" : order.type === queueStyle));
      const sortedOrders = orders.sort(sortOrders);

      if (!sortedOrders.length) {
        ordersList.innerHTML = '<div class="order-row"><div class="order-summary"><span class="order-label">No orders</span><span class="order-status-badge preparing">Waiting</span></div></div>';
        refreshQueueUi();
        return;
      }

      ordersList.innerHTML = sortedOrders.map(order => {
        const label = order.type === "number" ? `#${order.label}` : order.type === "number-name" ? `#${order.number || "?"} · ${order.label}` : order.label;
        const safeLabel = escapeHtml(label);
        const safeId = escapeHtml(order.id);
        const remaining = getReadyRemainingSeconds(order);
        const overdue = isOverdue(order);
        const removalText = remaining !== null
          ? `<small class="order-timer ${overdue ? "overdue" : ""}">${overdue ? "Please see staff" : `Ready reminder in ${formatCountdown(remaining)}`}</small>`
          : "";

        const isPreparing = order.status === "preparing";
        const primaryActionLabel = isPreparing ? "Mark Ready" : "Collected";
        const primaryAction = isPreparing ? "ready" : "collected";

        return `
          <div class="order-row ${order.status}${overdue ? " overdue" : ""}">
            <div class="order-summary">
              <div>
                <span class="order-label">${safeLabel}</span>
                ${removalText}
              </div>
              <span class="order-status-badge ${order.status}">${order.status}</span>
            </div>
            <div class="order-actions">
              <button type="button" class="order-action-btn ${isPreparing ? "ready" : "collected"}" data-order-id="${safeId}" data-action="${primaryAction}">${primaryActionLabel}</button>
              ${isPreparing ? "" : '<button type="button" class="order-action-btn preparing" data-order-id="' + safeId + '" data-action="preparing">Back to Preparing</button>'}
              <button type="button" class="order-action-btn edit" data-order-id="${safeId}" data-action="edit">Edit</button>
              <button type="button" class="order-action-btn remove" data-order-id="${safeId}" data-action="remove">Remove</button>
            </div>
          </div>
        `;
      }).join("");

      refreshQueueUi();
    }

    function ensureQueueStyle(style) {
      const nextStyle = ["number", "name", "number-name"].includes(style) ? style : "number";
      const currentOrders = loadOrders();
      const hasIncompatibleOrders = currentOrders.some(order => order.type !== nextStyle);

      if (hasIncompatibleOrders) {
        const confirmed = window.confirm("Switching queue style will replace incompatible demo orders. Continue?");
        if (!confirmed) return false;
      }

      persistQueueStyle(nextStyle);
      const defaultOrders = getDefaultOrdersForStyle(nextStyle);
      writeOrders(defaultOrders, { silent: false, skipRender: false });
      refreshQueueUi();
      return true;
    }

    function addOrder() {
      const queueStyle = getQueueStyle();
      const orders = loadOrders();

      if (editingOrderId) {
        const editedOrder = orders.find(order => order.id === editingOrderId);
        const editedValue = safeText(customerNameInput.value);
        const editedNumber = normalizeLegacyNumber(editedValue);
        if (editedOrder && editedValue && (editedOrder.type !== "number" || editedNumber)) {
          editedOrder.label = editedOrder.type === "number" ? editedNumber : editedValue;
          if (editedOrder.type === "number-name" && !editedOrder.number) {
            editedOrder.number = String(getNextNumber());
          }
          writeOrders(orders, { silent: false, skipRender: false });
        }
        editingOrderId = null;
        customerNameInput.value = "";
        customerNameInput.focus();
        refreshQueueUi();
        return;
      }

      if (queueStyle === "number") {
        const candidate = getNextNumber();
        const existingOrder = orders.filter(order => order.type === "number").find(order => Number(order.label) === candidate);

        if (existingOrder) {
          existingOrder.status = "preparing";
          delete existingOrder.readyAt;
        } else {
          orders.push({ id: makeOrderId("number"), label: String(candidate), type: "number", status: "preparing" });
        }

        writeOrders(orders, { silent: false, skipRender: false });
        setNextNumber(candidate + 1);
        return;
      }

      const name = safeText(customerNameInput.value);
      if (!name) {
        customerNameInput.focus();
        return;
      }

      const existingOrder = queueStyle === "number-name"
        ? null
        : orders.filter(order => order.type === queueStyle).find(order => order.label.toLowerCase() === name.toLowerCase());
      if (existingOrder) {
        existingOrder.status = "preparing";
        delete existingOrder.readyAt;
      } else {
        const nextOrder = { id: makeOrderId(queueStyle), label: name, type: queueStyle, status: "preparing" };
        if (queueStyle === "number-name") {
          nextOrder.number = String(getNextNumber());
          setNextNumber(Number(nextOrder.number) + 1);
        }
        orders.push(nextOrder);
      }

      writeOrders(orders, { silent: false, skipRender: false });
      customerNameInput.value = "";
      customerNameInput.focus();
    }

    function updateSpecificOrder(orderId, nextStatus) {
      const orders = loadOrders();
      const order = orders.find(item => item.id === orderId);
      if (!order) return;

      order.status = nextStatus;
      if (nextStatus === "ready") {
        order.readyAt = Date.now();
        delete order.collectedAt;
      } else if (nextStatus === "collected") {
        order.collectedAt = Date.now();
      } else {
        delete order.readyAt;
        delete order.collectedAt;
      }

      writeOrders(orders, { silent: false, skipRender: false });
    }

    function removeSpecificOrder(orderId) {
      const orders = loadOrders().filter(order => order.id !== orderId);
      writeOrders(orders, { silent: false, skipRender: false });
    }

    function editSpecificOrder(orderId) {
      const order = loadOrders().find(item => item.id === orderId);
      if (!order) return;
      editingOrderId = orderId;
      customerNameInput.value = order.type === "number" ? order.label : order.label;
      customerNameInput.focus();
      refreshQueueUi();
    }

    function resetDemoOrders() {
      const queueStyle = getQueueStyle();
      const defaultOrders = getDefaultOrdersForStyle(queueStyle);
      writeOrders(defaultOrders, { silent: false, skipRender: false });

      const nextNumber = queueStyle === "number-name"
        ? Math.max(...defaultOrders.map(order => Number(order.number) || 0), 0) + 1
        : queueStyle === "number"
          ? Math.max(...defaultOrders.map(order => Number(order.label) || 0), 0) + 1
          : 46;
      setNextNumber(nextNumber);
      customerNameInput.value = "";
      refreshQueueUi();
    }

    function initSetupButtons() {
      setupButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const selectedMode = button.dataset.setupMode;
          setupButtons.forEach((item) => item.classList.toggle("is-selected", item === button));
          completeSetup(selectedMode);
        });
      });
    }

    queueSettingsToggle.addEventListener("click", () => {
      const expanded = queueSettingsBody.classList.toggle("hidden") === false;
      queueSettingsToggle.setAttribute("aria-expanded", String(expanded));
    });

    overdueSelect.addEventListener("change", (event) => {
      setOverdueMinutes(Number(event.target.value) / 60);
    });

    readyChimeSelect.addEventListener("change", (event) => {
      setReadyChimeEnabled(event.target.value);
    });

    queueStyleSelect.addEventListener("change", (event) => {
      ensureQueueStyle(event.target.value);
    });

    addOrderBtn.addEventListener("click", addOrder);
    resetDemoBtn.addEventListener("click", resetDemoOrders);

    ordersList.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;

      const orderId = actionButton.dataset.orderId;
      const action = actionButton.dataset.action;
      if (action === "remove") {
        removeSpecificOrder(orderId);
        return;
      }
      if (action === "edit") {
        editSpecificOrder(orderId);
        return;
      }
      updateSpecificOrder(orderId, action);
    });

    customerNameInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      addOrder();
    });

    if (channel) {
      channel.addEventListener("message", (event) => {
        if (!event.data) return;

        if (event.data.type === "queue-style-update") {
          localStorage.setItem(QUEUE_STYLE_KEY, event.data.queueStyle || getQueueStyle());
        }

        if (event.data.type === "queue-settings-update") {
          if (event.data.overdueMinutes) {
            localStorage.setItem(OVERDUE_MINUTES_KEY, String(event.data.overdueMinutes));
          }
          if (typeof event.data.readyChime === "boolean") {
            localStorage.setItem(READY_CHIME_KEY, String(event.data.readyChime));
          }
        }

        if (event.data.type === "orders-update") {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(event.data.orders || []));
        }

        renderOrders();
      });
    }

    window.addEventListener("storage", (event) => {
      if ([STORAGE_KEY, QUEUE_STYLE_KEY, OVERDUE_MINUTES_KEY, READY_CHIME_KEY, SETUP_COMPLETE_KEY].includes(event.key)) {
        renderOrders();
      }
    });

    function startTimerSweep() {
      if (window.__stackedReadySweep) {
        clearInterval(window.__stackedReadySweep);
      }
      window.__stackedReadySweep = window.setInterval(() => {
        renderOrders();
      }, 1000);
    }

    initSetupButtons();
    refreshQueueUi();
    startTimerSweep();

    if (!isSetupComplete()) {
      setupPanel.classList.remove("hidden");
      adminQueueView.classList.add("hidden");
      setupButtons.forEach((button) => button.classList.remove("is-selected"));
    } else {
      setupPanel.classList.add("hidden");
      adminQueueView.classList.remove("hidden");
      renderOrders();
    }
  </script>
</body>
</html>
