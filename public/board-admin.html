<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PopBia Collection staff controls for managing preparing, ready and collected orders." />
  <title>PopBia Collection — Staff controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    [hidden] { display: none !important; }
    body {
      background: var(--paper);
      overflow-x: hidden;
    }

    .demo-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 4rem 1rem;
      background: #10243d;
      color: white;
    }

    .demo-panel {
      width: min(780px, calc(100vw - 24px));
      max-width: 100%;
      box-sizing: border-box;
      padding: clamp(1.5rem, 4vw, 3rem);
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: rgba(20,44,72,.9);
      box-shadow: 0 30px 80px rgba(0,0,0,.28);
      backdrop-filter: blur(8px);
    }

    .product-brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .65rem;
      margin-bottom: 2rem;
      font: 800 1rem/1 "Bricolage Grotesque", sans-serif;
    }

    .product-brand-mark {
      position: relative;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      background: #ff6433;
    }

    .product-brand-mark::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      height: 8px;
      border: 2px solid white;
      border-top: 0;
      border-radius: 0 0 12px 12px;
    }

    .product-brand-mark::after {
      content: "";
      position: absolute;
      top: 7px;
      left: 11px;
      width: 3px;
      height: 7px;
      border-radius: 99px;
      background: white;
      box-shadow: 8px 1px 0 white;
    }

    .product-brand span:last-child { color: rgba(255,255,255,.7); font-weight: 600; }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      padding: .45rem .75rem;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--ink);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .demo-panel h1 {
      margin: 1.1rem 0 1rem;
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.04em;
      text-transform: uppercase;
      font-size: clamp(2.7rem, 7vw, 5rem);
      line-height: .96;
    }

    .demo-panel p {
      max-width: 620px;
      color: rgba(255,255,255,.78);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .demo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .9rem;
      margin-top: 2rem;
    }

    .demo-actions .btn {
      min-width: 220px;
    }

    .demo-features {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1.5rem;
      padding-left: 1rem;
      color: rgba(255,255,255,.82);
      font-weight: 700;
    }

    .demo-features li {
      list-style: disc;
      margin-left: .2rem;
    }

    .demo-note {
      margin-top: 2.1rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.68);
      font-size: .95rem;
    }

    .demo-cta {
      margin-top: 2.2rem;
      padding: 1.4rem 1.2rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }

    .demo-cta h2 {
      margin: 0 0 .7rem;
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.04em;
      text-transform: uppercase;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
    }

    .demo-cta p {
      margin: 0 0 1rem;
      font-size: 1rem;
    }

    .demo-cta .btn {
      display: inline-flex;
      min-width: 220px;
    }

    .collection-demo {
      margin-top: 2rem;
      padding: 1.5rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 22px;
      background: rgba(17,17,17,.48);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }

    .collection-demo h2 {
      margin: 0 0 .45rem;
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.04em;
      text-transform: uppercase;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
    }

    .collection-demo p {
      margin: 0;
      color: rgba(255,255,255,.76);
      font-size: 1rem;
      line-height: 1.5;
    }

    .collection-controls {
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr));
      gap: .9rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      min-width: 0;
    }

    .field label {
      color: rgba(255,255,255,.82);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      min-height: 52px;
      padding: .8rem 1rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      color: white;
      font-weight: 700;
    }

    .field input::placeholder {
      color: rgba(255,255,255,.44);
    }

    .control-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      margin-top: 1rem;
    }

    .control-actions .btn {
      min-width: 150px;
    }

    .orders-list {
      margin-top: 1.2rem;
      display: grid;
      gap: .75rem;
    }

    .order-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 1rem;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      color: white;
      font-weight: 700;
    }

    .order-pill strong {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      letter-spacing: -.05em;
      font-family: "Archivo Black", sans-serif;
      text-transform: uppercase;
    }

    .order-pill span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      padding: .35rem .6rem;
      border-radius: 999px;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .order-pill.ready span {
      background: rgba(216,247,208,.15);
      color: #d8f7d0;
    }

    .order-pill.preparing span {
      background: rgba(247,229,169,.15);
      color: #f7e5a9;
    }

    .collection-note {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.72);
      font-size: .9rem;
      line-height: 1.5;
    }

    .setup-panel {
      margin-top: 1.25rem;
      padding: 1rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 18px;
      background: rgba(255,255,255,.04);
    }

    .setup-panel h3 {
      margin: 0 0 .9rem;
      font-size: 1.15rem;
      letter-spacing: -.03em;
      text-transform: none;
    }

    .setup-options {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    .setup-option {
      flex: 1 1 190px;
      min-height: 46px;
      padding: .75rem .9rem;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: all .18s ease;
    }

    .setup-option:hover,
    .setup-option:focus-visible {
      border-color: rgba(255,255,255,.4);
    }

    .setup-option.is-selected {
      background: var(--yellow);
      border-color: var(--ink);
      color: var(--ink);
      box-shadow: 4px 4px 0 rgba(17,17,17,.4);
    }

    .queue-settings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-top: 1rem;
      padding: .75rem 1rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
    }

    .admin-demo-note {
      display: none;
    }

    .queue-settings-body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem;
      width: 100%;
      padding-top: .75rem;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .queue-settings-body.hidden { display: none; }

    .queue-settings-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: .75rem;
      margin-left: auto;
    }

    .queue-settings.hidden,
    .admin-view.hidden,
    .setup-panel.hidden {
      display: none;
    }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem;
      color: rgba(255,255,255,.78);
      font-size: .9rem;
    }

    .settings-row[hidden] { display: none; }

    .settings-row label {
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .settings-row select {
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: white;
      padding: .45rem .7rem;
    }

    .queue-settings-btn {
      min-height: 42px;
      padding: .5rem .9rem;
      font-size: .78rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.04);
      color: white;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .queue-settings-btn.silver {
      background: rgba(196, 201, 208, 0.18);
      border-color: rgba(255,255,255,.22);
      color: rgba(255,255,255,.96);
    }

    .queue-settings-btn.silver:hover,
    .queue-settings-btn.silver:focus-visible {
      background: rgba(196, 201, 208, 0.26);
    }

    .admin-top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1rem;
      align-items: stretch;
    }

    .admin-connection-status {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin-left: auto;
      color: rgba(255,255,255,.58);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .admin-connection-status::before {
      content: "";
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: #78df75;
    }

    .admin-top-actions .btn {
      min-height: 52px;
      flex: 0 0 auto;
    }

    .admin-control-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .9rem;
      margin-top: 1rem;
      align-items: end;
    }

    .admin-action-field {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      justify-content: flex-end;
    }

    .admin-action-field .btn {
      width: 100%;
      min-height: 52px;
      justify-self: center;
      align-self: center;
      text-align: center;
    }

    .order-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(170px, 220px);
      grid-template-areas:
        "summary primary"
        "summary secondary";
      align-items: stretch;
      gap: .65rem 1rem;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }

    .order-summary {
      grid-area: summary;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: .35rem;
      min-width: 0;
    }

    .order-label {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -.05em;
      text-transform: uppercase;
      color: white;
    }

    .order-status-badge {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      padding: 0;
      border-radius: 0;
      background: transparent !important;
      font-size: .82rem;
      letter-spacing: .02em;
      text-transform: capitalize;
      font-weight: 800;
    }

    .order-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .35rem;
      min-height: 1.25rem;
    }

    .order-meta .order-timer::before {
      content: "·";
      margin-right: .35rem;
      color: rgba(255,255,255,.4);
    }

    .order-row.ready .order-status-badge {
      background: rgba(216,247,208,.15);
      color: #d8f7d0;
    }

    .order-row.preparing .order-status-badge {
      background: rgba(247,229,169,.15);
      color: #f7e5a9;
    }

    .order-row.ready.overdue .order-status-badge {
      background: rgba(239,69,56,.22);
      color: #ffb2aa;
    }

    .order-row.ready.overdue { border-color: rgba(239,69,56,.45); }

    .order-row.collected { opacity: .58; }

    .order-actions {
      display: contents;
    }

    .order-primary-action {
      grid-area: primary;
      display: flex;
    }

    .order-secondary-actions {
      grid-area: secondary;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .4rem;
    }

    .order-row.ready .order-secondary-actions .preparing {
      grid-column: 1 / -1;
    }

    .order-action-btn {
      min-height: 42px;
      padding: .62rem .8rem;
      border-radius: 10px;
      border: 2px solid transparent;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      min-width: 104px;
    }

    .order-primary-action .order-action-btn {
      width: 100%;
      min-height: 58px;
      font-size: .92rem;
    }

    .order-secondary-actions .order-action-btn {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 36px;
      padding: .42rem .55rem;
      border-width: 1px;
      background: rgba(255,255,255,.045);
      font-size: .66rem;
    }

    .order-action-btn.preparing {
      background: rgba(247,229,169,.22);
      border-color: rgba(247,229,169,.5);
      color: #f7e5a9;
    }

    .order-action-btn.ready {
      background: rgba(216,247,208,.22);
      border-color: rgba(216,247,208,.5);
      color: #d8f7d0;
    }

    .order-action-btn.remove {
      background: rgba(239,69,56,.14);
      border-color: rgba(239,69,56,.45);
      color: #ffb2aa;
    }

    .order-action-btn.edit {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.22);
      color: rgba(255,255,255,.86);
    }

    .order-action-btn.collected {
      background: rgba(120,223,117,.22);
      border-color: rgba(120,223,117,.5);
      color: #bff7b7;
    }

    .order-timer.overdue { color: #ffb2aa; font-weight: 800; }

    @media (max-width: 820px) {
      .collection-controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .demo-shell {
        padding: 1rem .75rem;
      }

      .demo-panel {
        padding: 1.25rem;
        border-radius: 20px;
      }

      .order-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "summary"
          "primary"
          "secondary";
        align-items: start;
        gap: .75rem;
        padding: .9rem;
      }

      .order-summary {
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: .6rem;
      }

      .order-summary > div {
        min-width: 0;
      }

      .order-label {
        display: block;
        overflow-wrap: anywhere;
      }

      .order-status-badge {
        min-width: 0;
        white-space: nowrap;
      }

      .order-timer {
        display: block;
        margin-top: .35rem;
      }

      .order-actions {
        display: contents;
      }

      .order-action-btn {
        min-width: 0;
        width: 100%;
        min-height: 48px;
        padding-inline: .55rem;
      }

      .order-secondary-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .order-row.ready .order-secondary-actions .preparing {
        grid-column: 1 / -1;
      }

      .demo-actions,
      .demo-actions .btn,
      .demo-cta .btn,
      .control-actions .btn {
        width: 100%;
      }

      .control-actions {
        flex-direction: column;
      }
    }
  </style>
  <link rel="stylesheet" href="collection-staff.css">
  <link rel="stylesheet" href="collection-entitlement.css">
</head>
<body>
  <main class="demo-shell">
    <div class="demo-panel">
      <header class="staff-header">
        <div class="product-brand"><span class="product-brand-mark" aria-hidden="true"></span><div><h1>PopBia Collection</h1><span>Staff controls</span></div></div>
        <a class="btn btn-dark" id="openBoard" href="board.html" target="_blank" rel="noopener noreferrer">Open board</a>
      </header>
      <p id="cloudMessage" role="status" aria-live="polite">Loading your workspace…</p>
      <button hidden id="logoutButton" class="queue-settings-btn" type="button">Log out</button>
    <div id="collectionEntitlement" class="collection-entitlement" role="status" aria-live="polite" hidden></div>
      <section hidden class="collection-demo" id="collection-demo" aria-label="Active queue">
        <div id="setupPanel" class="setup-panel hidden" aria-live="polite" hidden>
          <h3>How do you identify orders?</h3>
          <div class="setup-options">
            <button class="setup-option" type="button" data-setup-mode="number">Order numbers</button>
            <button class="setup-option" type="button" data-setup-mode="name">Customer names</button>
            <button class="setup-option" type="button" data-setup-mode="number-name">Order number + name</button>
          </div>
        </div>

        <div id="adminQueueView" class="admin-view hidden">
          <div id="queueSettingsPanel" class="queue-settings" aria-live="polite">
            <button class="queue-settings-btn" id="queueSettingsToggle" type="button" aria-expanded="false" aria-controls="queueSettingsBody">Queue settings</button>

            <span class="admin-connection-status">Connecting…</span>
            <div id="queueSettingsBody" class="queue-settings-body hidden">
            <div class="settings-row">
              <label for="queueStyleSelect">Queue style</label>
              <select id="queueStyleSelect">
                <option value="number">Order numbers</option>
                <option value="name">Customer names</option>
                <option value="number-name">Order number + name</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="overdueSelect">Ready reminder</label>
              <select id="overdueSelect">
                <option value="10">10 seconds</option>
                <option value="30">30 seconds</option>
                <option value="600" selected>10 minutes</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="readyChimeSelect">Ready chime</label>
              <select id="readyChimeSelect">
                <option value="on">On</option>
                <option value="off">Off</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="autoClearSelect">Auto-clear Ready orders</label>
              <select id="autoClearSelect" aria-describedby="autoClearHelp">
                <option value="off">Off</option>
                <option value="300">5 minutes</option>
                <option value="600" selected>10 minutes</option>
                <option value="900">15 minutes</option>
                <option value="1200">20 minutes</option>
                <option value="1800">30 minutes</option>
              </select>
            </div>
            <p id="autoClearHelp">Automatically mark Ready orders as collected after this amount of time.</p>
            <div class="queue-settings-actions">
              <button class="queue-settings-btn" id="resetDemoBtn" type="button">Clear active queue</button>
            </div>
            </div>
          </div>

        </div>

          <div class="admin-control-row">
            <div class="field" id="customerNameField">
              <label for="customerNameInput">Customer name</label>
              <input id="customerNameInput" type="text" maxlength="120" placeholder="e.g. Ronan" />
            </div>

            <div class="field admin-action-field">
              <span class="action-label">Add order</span>
              <button class="btn btn-yellow" id="addOrderBtn" type="button">Add order</button>
            </div>
          </div>

        <div class="orders-list" id="ordersList" aria-live="polite"></div>

      </section>
    </div>
  </main>

  <script src="client-config.js"></script>
  <script src="supabase-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="collection-cloud.js"></script>
  <script src="collection-entitlement.js"></script>
  <script src="collection-admin.js"></script>
</body>
</html>
